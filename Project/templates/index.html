<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Predictor | ML Project</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: var(--bg); 
            color: var(--text);
            display: flex; 
            justify-content: center; 
            padding: 40px 20px;
        }
        .container { 
            background: var(--card); 
            padding: 32px; 
            width: 100%;
            max-width: 500px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); 
        }
        h1 { font-size: 1.5rem; margin-bottom: 24px; text-align: center; color: var(--primary); }
        h3 { font-size: 0.9rem; margin-top: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; color: #64748b; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .full { grid-column: span 2; }
        
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
        input, select { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            box-sizing: border-box;
            font-size: 1rem;
        }
        input:focus { outline: 2px solid var(--primary); border-color: transparent; }
        
        button { 
            width: 100%; 
            padding: 14px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 1rem;
            cursor: pointer; 
            margin-top: 20px;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        
        .result-box { 
            margin-top: 30px; 
            padding: 20px; 
            background: #f0f9ff; 
            border: 1px solid #bae6fd; 
            border-radius: 12px; 
            text-align: center; 
        }
        .price { font-size: 1.5rem; font-weight: 700; color: #0369a1; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏠 House Price Predictor</h1>

    <form action="/predict" method="post">
        
        <div class="grid">
            <div class="full">
                <label>Area (sq ft)</label>
                <input type="number" name="area" placeholder="e.g. 5000" value="{{ form.area if form else '' }}" required step="any">
            </div>
            
            <div>
                <label>Bedrooms</label>
                <input type="number" name="bedrooms" value="{{ form.bedrooms if form else 2 }}" required min="1" max="10">
            </div>
            
            <div>
                <label>Bathrooms</label>
                <input type="number" name="bathrooms" value="{{ form.bathrooms if form else 1 }}" required min="1" max="10">
            </div>
            
            <div>
                <label>Stories</label>
                <input type="number" name="stories" value="{{ form.stories if form else 1 }}" required min="1" max="5">
            </div>
            
            <div>
                <label>Parking Spaces</label>
                <input type="number" name="parking" value="{{ form.parking if form else 0 }}" required min="0" max="10">
            </div>
        </div>

        <h3>Property Details</h3>
        <div class="grid">
            <div>
                <label>Main Road</label>
                <select name="mainroad">
                    <option value="yes" {% if form and form.mainroad == 'yes' %}selected{% endif %}>Yes</option>
                    <option value="no" {% if form and form.mainroad == 'no' %}selected{% endif %}>No</option>
                </select>
            </div>
            <div>
                <label>Guestroom</label>
                <select name="guestroom">
                    <option value="yes" {% if form and form.guestroom == 'yes' %}selected{% endif %}>Yes</option>
                    <option value="no" {% if not form or form.guestroom == 'no' %}selected{% endif %}>No</option>
                </select>
            </div>
            <div>
                <label>Basement</label>
                <select name="basement">
                    <option value="yes" {% if form and form.basement == 'yes' %}selected{% endif %}>Yes</option>
                    <option value="no" {% if not form or form.basement == 'no' %}selected{% endif %}>No</option>
                </select>
            </div>
            <div>
                <label>AC</label>
                <select name="airconditioning">
                    <option value="yes" {% if form and form.airconditioning == 'yes' %}selected{% endif %}>Yes</option>
                    <option value="no" {% if not form or form.airconditioning == 'no' %}selected{% endif %}>No</option>
                </select>
            </div>
            <div>
                <label>Hot Water</label>
                <select name="hotwaterheating">
                    <option value="yes" {% if form and form.hotwaterheating == 'yes' %}selected{% endif %}>Yes</option>
                    <option value="no" {% if not form or form.hotwaterheating == 'no' %}selected{% endif %}>No</option>
                </select>
            </div>
            <div>
                <label>Preferred Area</label>
                <select name="prefarea">
                    <option value="yes" {% if form and form.prefarea == 'yes' %}selected{% endif %}>Yes</option>
                    <option value="no" {% if not form or form.prefarea == 'no' %}selected{% endif %}>No</option>
                </select>
            </div>
        </div>

        <h3>Furnishing</h3>
        <select name="furnishingstatus" required>
            <option value="furnished" {% if form and form.furnishingstatus == 'furnished' %}selected{% endif %}>Furnished</option>
            <option value="semi-furnished" {% if not form or form.furnishingstatus == 'semi-furnished' %}selected{% endif %}>Semi-Furnished</option>
            <option value="unfurnished" {% if form and form.furnishingstatus == 'unfurnished' %}selected{% endif %}>Unfurnished</option>
        </select>

        <button type="submit">Predict Estimated Price</button>
    </form>

    {% if prediction %}
    <div class="result-box">
        <p style="margin-bottom: 8px; color: #64748b;">Estimated Market Value</p>
        <div class="price">₹ {{ prediction }}</div>
    </div>
    {% endif %}

</div>

</body>
</html>
